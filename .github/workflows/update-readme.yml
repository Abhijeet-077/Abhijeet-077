name: 🔄 Auto Update Profile README

on:
  schedule:
    - cron: '0 8,20 * * *'  # runs twice daily at 8 AM and 8 PM UTC
  workflow_dispatch:       # allows manual triggering
  push:
    branches: [ output ]   # also runs on push to output branch
    paths-ignore:
      - 'README.md'        # don't trigger on README changes to avoid loops

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write      # explicit permission for pushing changes
      actions: read        # permission to read actions data
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4  # updated to v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # fetch full history for better git operations
          
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # specific version for consistency
          
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: 📊 Update README with Profile Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 Update_readme.py


        
      - name: 🔍 Check for Changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: 💾 Commit & Push Changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "🤖 Auto-update README stats [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
          
      - name: 📧 Send Email Notification
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🤖 GitHub Profile README Auto-Updated Successfully"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          html_body: |
            <h2>🚀 GitHub Profile README Update Notification</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Update Time:</strong> $(date +'%Y-%m-%d %H:%M:%S UTC')</p>
            <p><strong>Status:</strong> ✅ Successfully Updated</p>
            <p><strong>Changes:</strong> Latest GitHub statistics and profile data have been automatically updated.</p>
            <hr>
            <p><strong>🎯 Debug Fighter Status:</strong> All systems operational</p>
            <p><strong>📊 Analytics:</strong> GitHub stats refreshed</p>
            <p><strong>🔄 Next Update:</strong> Scheduled for next automated run (twice daily at 8 AM & 8 PM UTC)</p>
            <hr>
            <p><em>This is an automated notification from your GitHub Profile README update system.</em></p>
            <p><a href="https://github.com/${{ github.repository }}">View Updated Profile</a></p>

      - name: 📝 Summary
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: echo "✅ README successfully updated with latest profile stats and email notification sent!"
